name: Release (Continuous Delivery)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar formato de la etiqueta (v#.#.#)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La etiqueta '$TAG' no tiene formato v#.#.#"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pruebas antes de liberar
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Empaquetar el repositorio en zip
        run: git archive --format=zip -o "todo-api-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      # Se usa un PAT (RELEASE_TOKEN): los releases creados con GITHUB_TOKEN
      # NO disparan otros workflows, y necesitamos que deploy.yml se ejecute.
      - name: Crear release en GitHub
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "todo-api-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
